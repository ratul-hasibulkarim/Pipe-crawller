; PIPEBOT-X firmware. Size is a build flag (PIPEBOT_SIZE_S / _M / _L); constants come from
; include/bot_params.h, generated from params/bot_params.yaml by tools/gen_params.py.
;
;   pio test -e native          unit tests (no hardware)
;   pio run  -e pico_M          RP2040 firmware for size M (also pico_S, pico_L)

[platformio]
default_envs = native

[common]
build_src_flags = -Wall -Wextra -Werror

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<hal/rp2040/>
build_flags = -std=c++17 -Iinclude -Isrc -DPIPEBOT_SIZE_M -DUNITY_INCLUDE_DOUBLE
build_src_flags = ${common.build_src_flags}

[env:native_S]
extends = env:native
build_flags = -std=c++17 -Iinclude -Isrc -DPIPEBOT_SIZE_S -DUNITY_INCLUDE_DOUBLE

[env:native_L]
extends = env:native
build_flags = -std=c++17 -Iinclude -Isrc -DPIPEBOT_SIZE_L -DUNITY_INCLUDE_DOUBLE

[pico_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 133000000L
build_src_filter = +<*> -<sim/>
build_unflags = -std=gnu++14
build_flags = -std=gnu++17 -Iinclude -Isrc
build_src_flags = ${common.build_src_flags}
; pinned git sources (reproducible, and independent of the PlatformIO registry)
lib_deps =
  https://github.com/teemuatlut/TMCStepper.git#v0.7.3
  https://github.com/adafruit/Adafruit_BusIO.git#1.16.1
  https://github.com/adafruit/Adafruit_Sensor.git#1.1.14
  https://github.com/adafruit/Adafruit_NeoPixel.git#1.12.3
  https://github.com/adafruit/Adafruit_BNO08x.git#1.2.5
  https://github.com/pololu/vl53l1x-arduino.git#1.3.1
  https://github.com/adafruit/Adafruit_SHT31.git#2.2.2
  https://github.com/adafruit/Adafruit_BMP3XX.git#2.1.5
  https://github.com/adafruit/Adafruit_INA219.git#1.2.3

[env:pico_S]
extends = pico_base
build_flags = ${pico_base.build_flags} -DPIPEBOT_SIZE_S

[env:pico_M]
extends = pico_base
build_flags = ${pico_base.build_flags} -DPIPEBOT_SIZE_M

[env:pico_L]
extends = pico_base
build_flags = ${pico_base.build_flags} -DPIPEBOT_SIZE_L
