    max_grip_force_per_arm_n: 250
    mass_target_kg: 15.0
    cg_offset_mm: 8
    max_speed_mm_s: 70
    lever: {pivot_radius_mm: 55, length_mm: 250, plate_thickness_mm: 5, plate_height_mm: 40}
    rocker: {axle_offset_mm: 12, pod_drop_mm: 12, spring_rate_n_mm: 3.2, contact_stiffness_n_mm: 370, plate_thickness_mm: 4, belt_width_mm: 9}
    expansion: {motor: NEMA23L, planetary_ratio: 10, bevel_ratio: 2.75, sector_module_mm: 2.5, sector_teeth: 36, sector_face_mm: 32, worm_pitch_dia_mm: 40}
    drive: {motor: NEMA23, worm_ratio: 21, worm_rated_torque_nm: 10.0, axle_dia_mm: 8, bearing: "MR128ZZ"}
    layout: {rear_pod_mm: 250, mid_zone_mm: 260, joint_mm: 45, front_pod_mm: 235, joint_max_angle_deg: 45, spine_dia_mm: 40, spine_wall_mm: 2, wall_mm: 3}
    power: {motor_rail_v: 24, stepper_driver: TMC5160, compute_board: "Pi 5", compute_avg_w: 9.0, compute_peak_w: 12.0, battery_series: 6, battery_parallel: 2, cell_ah: 3.5, buck_motor_a: 20.0, buck_5v_a: 5.0}

# ---------------------------------------------------------------------------------------
# CAD-only constants (consumed by cad/). Per-size geometry above stays authoritative.
cad:
  min_wall_mm: 2.5                   # FDM rule 5
  fillet_mm: 1.0
  moving_clearance_mm: 0.5
  bulkhead_mm: {S: 4, M: 5, L: 8}
  lug_thickness_mm: {S: 2.5, M: 3, L: 5}
  pin_dia_mm: {S: 3, M: 4, L: 6}            # rocker stub pins, axles of small links
  pivot_shaft_dia_mm: {S: 8, M: 12, L: 20}  # keyed lever shaft: carries full lever torque (tau = 16T/pi d^3)
  fastener: {S: M2.5, M: M3, L: M4}
  heat_set_insert:                   # hole dia, depth
    M2: [3.2, 4.0]
    M2.5: [3.6, 5.0]
    M3: [4.0, 5.7]
    M4: [5.6, 8.1]
  dome_outer_radius_mm: {S: 21, M: 30, L: 52}
  dome_wall_mm: {S: 1.5, M: 2.0, L: 3.0}
  led_ring_thickness_mm: {S: 5, M: 6, L: 8}
  bumper_height_mm: {S: 6, M: 8, L: 12}
  drive_gearbox_len_mm: {S: 18, M: 25, L: 40}
  belt_pulley_pitch_dia_mm: {S: 7.6, M: 12.2, L: 19.1}
  belt_thickness_mm: {S: 1.4, M: 1.4, L: 1.6}
  planetary_len_mm: {S: 20, M: 30, L: 50}
  bevel_module_mm: {S: 0.8, M: 1.0, L: 2.0}
  bevel_pinion_teeth: {S: 12, M: 10, L: 12}  # crown + pinion must clear the worm: Rc + 1.5m <= r_pivot - worm_len/2
  worm_length_mm: {S: 10, M: 16, L: 30}
  cap_min_mm: 6
  tilt_servo: {S: nano, M: nano, L: micro}
  pan_drive: {S: n20, M: n20, L: ga25}
  tread_sleeve_mm: {S: 4, M: 6, L: 10}     # pipe_size_adapter: extra tread radius -> +2x pipe ID
  print_orientation_bores_vertical: true
  stroke_samples: 9
  gimbal_pan_samples_deg: [-180, -90, 0, 90, 180]
  gimbal_tilt_samples_deg: [-90, -45, 0, 45, 90]
  interference_tolerance_mm3: 0.5
  mass_allowance_frac: 0.12          # wiring, grease, potting, fasteners not modelled in CAD

