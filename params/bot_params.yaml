  L:
    pipe_id_min_mm: 300
    pipe_id_max_mm: 650
    body_dia_mm: 140
    chassis_length_mm: 380
    wheel_dia_mm: 70
    wheel_width_mm: 30
    wheel_crown_radius_mm: 45
    wheelbase_mm: 230
    max_grip_force_per_arm_n: 70
    mass_target_kg: 4.0
    drive_motor: NEMA17
    expansion_motor: NEMA17
    return_spring_force_n: 10
    arm_spring_rate_n_mm: 1.4
    cg_offset_mm: 8
    arm_cantilever_mm: 90
    arm_section_b_mm: 20
    arm_section_h_mm: 14
    drive_worm_rated_torque_nm: 3.0
    compute_board: "Pi 5"
    compute_avg_w: 9.0
