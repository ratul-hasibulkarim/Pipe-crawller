  PETG: {density: 1.27, process: "FDM", cost_per_kg: 25}
  CuSn12: {density: 8.80, process: "CNC (hobbed)", cost_per_kg: 60}
  42CrMo4: {density: 7.85, process: "CNC + induction hardened", cost_per_kg: 40}
  SS316: {density: 8.00, process: "CNC", cost_per_kg: 35}
  silicone-60A: {density: 1.10, process: "cast in mold", cost_per_kg: 40}
  TPU-95A: {density: 1.21, process: "FDM", cost_per_kg: 45}
  PC: {density: 1.20, process: "vacuum-formed / machined", cost_per_kg: 30}
  EPDM: {density: 1.15, process: "moulded", cost_per_kg: 30}
  POM: {density: 1.41, process: "CNC", cost_per_kg: 20}

