    body_dia_mm: 78
    chassis_length_mm: 260
    wheel_dia_mm: 45
    wheel_width_mm: 20
    wheel_crown_radius_mm: 28
    wheelbase_mm: 150
    max_grip_force_per_arm_n: 35
    mass_target_kg: 1.8
    drive_motor: NEMA14
    expansion_motor: NEMA14
    return_spring_force_n: 8
    arm_spring_rate_n_mm: 1.2
    cg_offset_mm: 5
    arm_cantilever_mm: 55
    arm_section_b_mm: 14
    arm_section_h_mm: 10
    drive_worm_rated_torque_nm: 1.2
    compute_board: "CM4"
    compute_avg_w: 4.0
    compute_peak_w: 7.5
    battery_capacity_ah: 3.0         # 4S1P 18650
    buck_12v_a: 5.0
