# PIPEBOT-X single source of truth (revision 3).
# Every physical constant used by calcs, CAD, firmware, Pi, app and docs comes from here.
#
# Revision 2 (design calcs, step 1):
#   R2.1 Expansion drive direct, no 1:20 worm (needed 2-8k motor rpm for the 20 s sweep).
#   R2.2 Lead angle from the pitch diameter: Tr8x1.5 is 3.77 deg, not 3.41 deg.
#   R2.3 Drive wheels through self-locking worms; belt + stepper detent held only 5-15% of T1.
#   R2.4 Expansion motor size-scaled.  R2.5 Radial stroke derived from pipe range.
#   R2.6 Grip force measured by arm-spring deflection (hall), not stepper current.
#   R2.7 Battery and buck ratings size-scaled.
# Revision 3 (packaging, steps 2-5):
#   R3.1 Cone nut + radial rails replaced by worm-sector levers. The radial stroke is ~2x
#        the body radius on every size, so a radial slide has no guide length, and a
#        wedge needs 2*stroke/MA of free axial space beside the follower. Three radial
#        self-locking worms, driven by one central bevel gear, turn a gear sector on each
#        lever pivot: synchronous, self-centring, holds with power off.
#   R3.2 Wheels ride on a pivoting rocker (bogie) with a +/-5 mm sprung slide = compliance
#        + force sensor. Each wheel of a pair carries exactly half the arm force.
#   R3.2b Rocker pivot sits axle_offset below the axles so the sprung slot + spring cap stay
#        a weld-bead height below the wall.
#   R3.3 Size S re-rated 75-160 -> 100-200 mm. Three drive pods + levers + worms cannot fit
#        a 75 mm bore (arm parts at 120 deg collide inside r~15 mm); body 44 -> 56 mm.
#        Below 100 mm use a push-rod camera.
#   R3.4 Size S is tether-powered (no room for a 4S pack and it would break the elbow
#        length limit). M carries its pack in the hollow spine, L in the rear pod.
#   R3.4b Drive pods: S uses NEMA8 + 30:1 worm module (NEMA11 pod is too wide for three arms
#        in a 100 mm bore), S top speed 60 mm/s; one serpentine belt per rocker.
#   R3.5 Masses re-estimated from the CAD mass report (+12 % wiring/grease allowance):
#        S 1.8, M 4.2, L 15.0 kg. Grip, worm ratios and speeds re-sized to match
#        (M 95 mm/s, L 70 mm/s top speed: slip-before-stall at the higher grip).
#   R3.6 Elbow check uses exact rigid-cylinder-in-torus geometry (step 1 sagitta was
#        over-conservative). With real motor/gearbox lengths a one-piece body is too long
#        for a 2D-3D bend on M, so the camera pod rides on a sprung, booted U-joint:
#        rigid segments are (rear pod + mid zone) and (front pod).
#   R3.6b Front pods hold dome + gimbal + compute board + controller in line: S 182, M 192, L 235 mm.
#   R3.8 Wheel bearings are thin-section (MR74/MR106/MR128) so they sit inside the rocker plate
#        thickness; the outer plate corner stays a weld-bead height off a 100 mm wall.
#   R3.9 L runs a 24 V motor rail (6S2P pack direct, or 48->24 V buck on tether) (sweep speed) and TMC5160 drivers: a NEMA23 at 2.8 A
#        exceeds the TMC2209's 2 A RMS.
#   R3.7 Bend rating is 3 x pipe ID (piggable 3D bend). A fixed 300 mm radius is 3D for S
#        but 1D for L, which no rigid 600 mm robot can pass.
#   R3.10 Found in SIL: the hall slide sensor saturates when a rocker reaches its stop
#        (working + k * travel), and past the stop the true wall force climbs on the
#        structure's stiffness, unseen (M: sensor 73 N, true 187 N). The firmware now
#        servos only below GRIP_LIMIT_N = sensor max - overshoot band, and the hold margins
#        use that limit. L spring rate 3.0 -> 3.2 N/mm to keep the T1 margin >= 1.25.
#   R3.11 Horizontal pipe: the bottom arm carries grip + 2W/3 (statics, one arm straight
#        down), past the spring stop. Lever, sector and worm are now sized for it:
#        sector face S 9->10, M 15->16, L 27->32 mm; L lever plates 6x34 -> 5x40 mm.
#        Firmware judges squeeze by the median arm (sag loads one arm, squeeze all three).
#   R3.13 Stroke margins (calc/mechanism.py stroke()): retracted clears the min pipe by
#        insertion_clearance_mm, extended reaches the max pipe with the slide fully
#        compressed. Packaging then re-rates S 100->102 and M 150->152 mm (4" and 6" Sch40
#        are 102.3 and 154.1 mm ID). Reported ID subtracts slide + tread squash (F/k_contact).
#   R3.12 Simulator thermal model from geometry (hull area, YAML `thermal`), torque scales
#        with the run current the firmware sets, wall friction per pipe material (T6).

common:
  gravity_m_s2: 9.81
  arm_count: 3
  arm_angle_deg: 120
  wheels_per_arm: 2
  wheel_material: "TPU 95A hub, 60 Shore A silicone overmold tread"
  wheel_dry_friction_coeff: 0.75
  wheel_wet_friction_coeff: 0.42
  # Tread-on-wall friction per pipe material (dry, wet). ESTIMATES for 60A silicone on
  # clean walls: measure them with the tilt-table procedure in docs/test_plan.md and
  # replace. Used by T6 (material matrix) in the simulator. biofilm_drain is the
  # realistic worst case (slime on HDPE/PVC sewer): informational, not a rated surface.
  pipe_materials:
    steel:          {mu_dry: 0.75, mu_wet: 0.42}
    pvc:            {mu_dry: 0.65, mu_wet: 0.40}
    hdpe:           {mu_dry: 0.55, mu_wet: 0.32}
    cast_iron:      {mu_dry: 0.80, mu_wet: 0.50}
    concrete_lined: {mu_dry: 0.85, mu_wet: 0.55}
    biofilm_drain:  {mu_dry: 0.25, mu_wet: 0.15}
  grip_safety_factor: 2.0
  min_transient_safety_factor: 1.5
  hold_test_load_multiple: 3.0       # T1: total axial load = this x robot weight (dry pipe)
  hold_test_min_margin: 1.25
  hold_incline_deg: [0, 30, 45, 60, 90]
  bend_radius_over_pipe_id: 3.0      # 3D bends = piggable-line standard; spec's fixed 300 mm is 1D on L (R3.7)
  elbow_clearance_mm: 2
  insertion_clearance_mm: 1          # radial wheel-to-wall gap at the min pipe, arms retracted
  sweep_time_s: 20                   # T4 full-range expand time limit
  min_runtime_min: 60
  arm_compliance_travel_mm: 5        # +/- sprung rocker slide
  wheel_alignment_error_deg: 1.0
  pod_wheel_clearance_mm: 3          # wheel inner edge vs pod shell
  weld_bead_mm: 5                    # T9 obstacle; nothing but tread may be this close to the wall
  lever_angle_limits_deg: [0, 72]    # worm-sector drive has no toggle point; 72 deg keeps sector teeth on the arc

  expansion_worm:
    starts: 1
    friction_coeff: 0.10             # hardened steel worm on CuSn12 bronze sector
    min_self_lock_margin: 1.5
    sector_allow_stress_mpa: 90      # CuSn12 bending, Lewis
    lewis_form_factor: 0.33
    planetary_efficiency: 0.90
    bevel_efficiency: 0.95

  drive_worm:
    lead_angle_deg: 3.0
    friction_coeff: 0.10
    min_self_lock_margin: 1.5
    min_rating_margin: 1.25

  motor_limits:
    rpm_utilization: 0.85
    squeeze_torque_fraction: 0.7     # low-speed fraction of holding torque
    speed_torque_fraction: 0.4       # at max running speed
    min_torque_margin: 1.5
    drive_motor_efficiency: 0.4
    steps_per_rev: 200
    microsteps: 16

  arm_structure:
    material: "6061-T6"
    e_modulus_gpa: 68.9
    yield_mpa: 240
    min_yield_sf: 2.0
    max_wheel_deflection_mm: 0.5
    printed_material: "PETG"
    printed_e_modulus_gpa: 2.1

  power:
    camera_w: 1.5
    mcu_sensors_w: 0.9
    led_white_w_max: 4.0
    led_ir_w_max: 2.0
    led_avg_duty: 0.5
    gimbal_avg_w: 0.5
    gimbal_peak_w: 3.0
    cell_nominal_v: 3.7
    battery_cutoff_v_per_cell: 3.3
    battery_usable_fraction: 0.8
    converter_efficiency: 0.9
    driver_efficiency: 0.9
    motor_run_current_fraction: 0.7
    motor_hold_current_fraction: 0.25
    crawl_duty: 0.6
    rail_margin: 1.25
    rail_logic_v: 5.0
    tether_v: 48.0                     # SELV (<60 V DC); 24 V cannot push M/L peak power down 50 m
    tether_conductor_ohm_per_m: 0.034  # 2 x 0.5 mm^2 copper, loop resistance per metre of cable
    tether_min_v_at_robot: 30.0       # robot 48 V -> 12 V buck minimum input

  rejected:                          # original-spec numbers, kept as evidence
    expansion_worm_ratio: 20
    leadscrew_lead_mm: 1.5
    leadscrew_pitch_dia_mm: 7.25
    leadscrew_nominal_dia_mm: 8.0
    leadscrew_mu: 0.15
    drive_belt_ratio: 3.0
    drive_belt_efficiency: 0.95
    cone_half_angle_deg: 40

  control:
    drive_loop_hz: 1000
    expansion_loop_hz: 200
    telemetry_hz: 20
    watchdog_timeout_ms: 1000
    slip_detect_ms: 200
    slip_velocity_error_frac: 0.3
    drive_ttl_ms: 200
    expand_ttl_ms: 500
    critical_v_per_cell: 3.3
    drive_over_current_frac: 0.9      # x motor-buck rating (INA219 on the drive rail)
    expand_over_current_frac: 0.5     # x motor-buck rating (INA219 on the expansion motor)
    thermal_derate_c: 70
    thermal_trip_c: 85
  thermal:                           # simulator model of the hottest motor / driver
    hull_convection_w_m2k: 8         # aluminium hull to still air in the pipe (natural convection)
    driver_to_hull_k_per_w: 2.0      # one motor's copper loss -> flange / thermal pad -> hull
    time_constant_s: 120

  tether_length_m: [10, 20, 50]
  tether_od_mm: 6.5
  # 2 x 0.5 mm^2 power (48 V), 2 x 26 AWG shielded twisted pairs (100BASE-TX Ethernet,
  # 100 m max), aramid strength member, PU jacket. Reel: Ethernet slip ring + Wi-Fi AP.
  tether_data: "100BASE-TX over 2 shielded twisted pairs"
  tether_break_load_factor: 5        # x robot weight
  ip_rating: "IP68"
  operating_temp_c: [-10, 60]
  camera: "IMX708 wide, 120 deg FOV, 1080p30"
  gimbal_pan_range_deg: [-180, 180]
  gimbal_tilt_range_deg: [-90, 90]

stepper_drivers:                    # max RMS phase current (A), max supply (V)
  TMC2209: {max_rms_a: 2.0, max_v: 29}
  TMC5160: {max_rms_a: 4.0, max_v: 60}

motors:
  NEMA8: {frame_mm: 20.3, length_mm: 42, mass_kg: 0.08, holding_torque_nm: 0.04, rated_current_a: 0.6, winding_ohm: 8.0, detent_torque_nm: 0.002, max_rpm: 1600, max_rpm_24v: 2480, shaft_mm: 4}
  NEMA11: {frame_mm: 28.2, length_mm: 32, mass_kg: 0.11, holding_torque_nm: 0.12, rated_current_a: 0.67, winding_ohm: 6.0, detent_torque_nm: 0.007, max_rpm: 1500, max_rpm_24v: 2325, shaft_mm: 5}
  NEMA14: {frame_mm: 35.2, length_mm: 28, mass_kg: 0.14, holding_torque_nm: 0.25, rated_current_a: 1.0, winding_ohm: 3.6, detent_torque_nm: 0.012, max_rpm: 1000, max_rpm_24v: 1550, shaft_mm: 5}
  NEMA17: {frame_mm: 42.3, length_mm: 40, mass_kg: 0.28, holding_torque_nm: 0.45, rated_current_a: 1.5, winding_ohm: 2.3, detent_torque_nm: 0.022, max_rpm: 600, max_rpm_24v: 930, shaft_mm: 5}
  NEMA23: {frame_mm: 56.4, length_mm: 56, mass_kg: 0.70, holding_torque_nm: 1.2, rated_current_a: 2.8, winding_ohm: 0.9, detent_torque_nm: 0.04, max_rpm: 500, max_rpm_24v: 775, shaft_mm: 8}
  NEMA23L: {frame_mm: 56.4, length_mm: 76, mass_kg: 1.0, holding_torque_nm: 1.9, rated_current_a: 2.8, winding_ohm: 1.13, detent_torque_nm: 0.07, max_rpm: 450, max_rpm_24v: 697, shaft_mm: 8}

sizes:
  S:
    pipe_id_min_mm: 102
    pipe_id_max_mm: 200
    body_dia_mm: 56
    wheel_dia_mm: 30
    wheel_width_mm: 12
    wheel_crown_radius_mm: 18
    wheelbase_mm: 95
    max_grip_force_per_arm_n: 36
    mass_target_kg: 1.8
    cg_offset_mm: 3
    max_speed_mm_s: 60
    lever: {pivot_radius_mm: 21, length_mm: 70, plate_thickness_mm: 3, plate_height_mm: 10}
    rocker: {axle_offset_mm: 11, pod_drop_mm: 10, spring_rate_n_mm: 1.0, contact_stiffness_n_mm: 150, plate_thickness_mm: 2.5, belt_width_mm: 3}
    expansion: {motor: NEMA14, planetary_ratio: 5, bevel_ratio: 2.25, sector_module_mm: 1.0, sector_teeth: 30, sector_face_mm: 10, worm_pitch_dia_mm: 16}
    drive: {motor: NEMA8, worm_ratio: 35, worm_rated_torque_nm: 0.6, axle_dia_mm: 4, bearing: "MR74ZZ"}
    layout: {rear_pod_mm: 92, mid_zone_mm: 136, joint_mm: 20, front_pod_mm: 182, joint_max_angle_deg: 45, spine_dia_mm: 16, spine_wall_mm: 2, wall_mm: 2.5}
    power: {motor_rail_v: 12, stepper_driver: TMC2209, compute_board: "Pi Zero 2 W", compute_avg_w: 2.0, compute_peak_w: 3.5, battery_series: 0, battery_parallel: 0, cell_ah: 0, buck_motor_a: 6.0, buck_5v_a: 3.0}
  M:
    pipe_id_min_mm: 152
    pipe_id_max_mm: 320
    body_dia_mm: 78
    wheel_dia_mm: 45
    wheel_width_mm: 20
    wheel_crown_radius_mm: 28
    wheelbase_mm: 150
    max_grip_force_per_arm_n: 76
    mass_target_kg: 4.2
    cg_offset_mm: 5
    max_speed_mm_s: 95
    lever: {pivot_radius_mm: 33, length_mm: 116, plate_thickness_mm: 4, plate_height_mm: 14}
    rocker: {axle_offset_mm: 8, pod_drop_mm: 8, spring_rate_n_mm: 1.6, contact_stiffness_n_mm: 210, plate_thickness_mm: 3, belt_width_mm: 6}
    expansion: {motor: NEMA17, planetary_ratio: 5, bevel_ratio: 4, sector_module_mm: 1.5, sector_teeth: 30, sector_face_mm: 16, worm_pitch_dia_mm: 24}
    drive: {motor: NEMA14, worm_ratio: 20, worm_rated_torque_nm: 2.0, axle_dia_mm: 6, bearing: "MR106ZZ"}
    layout: {rear_pod_mm: 135, mid_zone_mm: 216, joint_mm: 28, front_pod_mm: 192, joint_max_angle_deg: 45, spine_dia_mm: 48, spine_wall_mm: 1.5, wall_mm: 2.5}
    power: {motor_rail_v: 12, stepper_driver: TMC2209, compute_board: "CM4", compute_avg_w: 4.0, compute_peak_w: 7.5, battery_series: 4, battery_parallel: 1, cell_ah: 3.5, buck_motor_a: 10.0, buck_5v_a: 3.0}
  L:
    pipe_id_min_mm: 300
    pipe_id_max_mm: 650
