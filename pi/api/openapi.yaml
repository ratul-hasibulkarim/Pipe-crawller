                title: Response Expand Job Api V1 Expand Get
    post:
      summary: Expand
      operationId: expand_api_v1_expand_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpandBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Expand Cancel
      operationId: expand_cancel_api_v1_expand_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
