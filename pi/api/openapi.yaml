  /api/v1/recordings:
    get:
      summary: Recordings
      operationId: recordings_api_v1_recordings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response Recordings Api V1 Recordings Get
  /api/v1/recordings/{rid}:
    get:
      summary: Recording
      operationId: recording_api_v1_recordings__rid__get
      parameters:
      - name: rid
        in: path
        required: true
        schema:
          type: string
          title: Rid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Recording Api V1 Recordings  Rid  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recordings/{rid}/export.csv:
    get:
      summary: Export Csv
      operationId: export_csv_api_v1_recordings__rid__export_csv_get
      parameters:
      - name: rid
        in: path
        required: true
        schema:
          type: string
          title: Rid
      - name: start_s
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Start S
      - name: end_s
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: End S
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recordings/{rid}/telemetry.json:
    get:
      summary: Rec Telemetry
      operationId: rec_telemetry_api_v1_recordings__rid__telemetry_json_get
      parameters:
      - name: rid
        in: path
        required: true
        schema:
          type: string
          title: Rid
      - name: step
        in: query
        required: false
        schema:
          type: integer
          default: 5
          title: Step
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Rec Telemetry Api V1 Recordings  Rid  Telemetry Json
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recordings/{rid}/video.mp4:
    get:
      summary: Rec Video
      operationId: rec_video_api_v1_recordings__rid__video_mp4_get
      parameters:
      - name: rid
        in: path
        required: true
