  /api/v1/recordings/{rid}/snapshots/{name}:
    get:
      summary: Rec Snapshot
      operationId: rec_snapshot_api_v1_recordings__rid__snapshots__name__get
      parameters:
      - name: rid
        in: path
        required: true
        schema:
          type: string
          title: Rid
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recordings/{rid}/clip.mp4:
    get:
      summary: Rec Clip
      description: Re-encode a segment of the run video.
      operationId: rec_clip_api_v1_recordings__rid__clip_mp4_get
      parameters:
      - name: rid
        in: path
        required: true
        schema:
          type: string
          title: Rid
      - name: start_s
        in: query
        required: true
        schema:
          type: number
          title: Start S
      - name: end_s
        in: query
        required: true
        schema:
          type: number
          title: End S
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      summary: No App
      operationId: no_app__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response No App  Get
components:
  schemas:
    DriveBody:
      properties:
        linear_mm_s:
          type: number
          title: Linear Mm S
          description: + forward / up the pipe
        turn_deg_s:
          type: number
          title: Turn Deg S
          default: 0.0
        bend_dir_deg:
          type: number
          title: Bend Dir Deg
          default: 0.0
        ttl_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ttl Ms
      type: object
      required:
      - linear_mm_s
      title: DriveBody
      description: POST /drive.
    ExpandBody:
      properties:
        mode:
          type: string
          title: Mode
          description: DIAMETER (mm) | FORCE (N per arm) | RETRACT
          default: FORCE
        target:
          anyOf:
          - type: number
          - type: 'null'
          title: Target
      type: object
      title: ExpandBody
      description: POST /expand.
    GimbalBody:
      properties:
        pan_deg:
          type: number
          title: Pan Deg
          default: 0.0
        tilt_deg:
          type: number
          title: Tilt Deg
          default: 0.0
      type: object
      title: GimbalBody
      description: POST /gimbal.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LightBody:
      properties:
        white_pct:
          type: integer
          title: White Pct
          default: 0
        ir_pct:
          type: integer
          title: Ir Pct
          default: 0
      type: object
      title: LightBody
      description: POST /light.
    MarkBody:
      properties:
        label:
          type: string
          title: Label
          default: event
      type: object
      title: MarkBody
      description: POST /mark.
    OfferBody:
      properties:
        sdp:
          type: string
          title: Sdp
        type:
          type: string
          title: Type
      type: object
      required:
      - sdp
      - type
      title: OfferBody
      description: WebRTC offer.
    ParamBody:
      properties:
        name:
          type: string
          title: Name
        value:
          type: number
          title: Value
      type: object
      required:
      - name
      - value
      title: ParamBody
      description: POST /param.
    RecordBody:
      properties:
        operator:
          type: string
          title: Operator
          default: ''
        pipe_id_range:
          type: string
          title: Pipe Id Range
          default: ''
        note:
          type: string
          title: Note
          default: ''
      type: object
      title: RecordBody
      description: POST /recording/start.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
