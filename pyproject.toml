[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["pi/app/protocol_gen.py", "firmware", "app", "cad/exports"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "D"]
ignore = ["D203", "D213", "D100", "D104", "D105", "D107", "B008", "B023"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["D"]
"tests/*" = ["D"]
"cad/build.py" = ["E501"]  # assembly-manual prose

[tool.black]
line-length = 150
